# Single-node Trino: the coordinator also runs tasks. Production runs a coordinator
# plus a worker fleet (often autoscaled), with TLS and an authenticator in front.
coordinator=true
node-scheduler.include-coordinator=true
http-server.http.port=8080
discovery.uri=http://localhost:8080
# Sized for a ~1.2 GB heap (MaxRAMPercentage=75 of a 1.6 GB container).
query.max-memory=800MB
query.max-memory-per-node=600MB
query.max-execution-time=2m
