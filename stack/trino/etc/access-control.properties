# File-based access control: who may read which catalog/schema/table, plus row filters.
# This is the *engine-level* guard. Cube applies its own row-level security on top,
# but raw text-to-SQL goes straight to Trino, so Trino must enforce it too.
access-control.name=file
security.config-file=/etc/trino/rules.json
security.refresh-period=30s
