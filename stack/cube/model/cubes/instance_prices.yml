# Reference data that exists nowhere in the lakehouse: hourly list prices.
# Defining it in the semantic layer is fine for a small, slow-changing lookup; for a real
# price book you'd load AWS's pricing API into an Iceberg table and point sql_table at it.
cubes:
  - name: instance_prices
    public: false
    sql: >
      SELECT * FROM (VALUES
        ('t3.micro', 0.0104), ('t3.xlarge', 0.1664),
        ('m5.large', 0.096), ('m5.xlarge', 0.192),
        ('m6g.xlarge', 0.154), ('m6i.xlarge', 0.192), ('m6i.2xlarge', 0.384), ('m6i.4xlarge', 0.768),
        ('m7i.large', 0.1008), ('m7i.xlarge', 0.2016), ('m7i.2xlarge', 0.4032),
        ('c7a.2xlarge', 0.4106), ('c7a.4xlarge', 0.8211), ('c7g.4xlarge', 0.58),
        ('c7i.xlarge', 0.1785), ('c7i.2xlarge', 0.357),
        ('r6i.large', 0.126), ('r6g.4xlarge', 0.8064), ('r7g.2xlarge', 0.4284), ('r7g.4xlarge', 0.8568),
        ('i4g.4xlarge', 1.2355), ('i4i.2xlarge', 0.686),
        ('g5.2xlarge', 1.212), ('g5.12xlarge', 5.672), ('p4d.24xlarge', 32.7726)
      ) AS t (instance_type, on_demand_usd_per_hour)
    dimensions:
      - name: instance_type
        sql: "{CUBE}.instance_type"
        type: string
        primary_key: true
      - name: on_demand_usd_per_hour
        sql: "{CUBE}.on_demand_usd_per_hour"
        type: number
        description: Approximate us-east-1 Linux on-demand list price, USD per hour.
